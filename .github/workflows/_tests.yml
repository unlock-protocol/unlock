name: Unlock Test Suite

on:
  workflow_call:
    inputs:
      # pass none to run all tests
      changed:
        description: 'The services/apps that changed (JSON array stringified)'
        type: string
        required: false
        default: '[
          "locksmith",
          "packages/contracts",
          "packages/hardhat-plugin",
          "packages/unlock-js",
          "packages/paywall",
          "paywall-app",
          "smart-contracts",
          "governance",
          "subgraph",
          "unlock-protocol-com",
          "wedlocks",
          "provider",
          "unlock-app",
          "governance-app",
          "packages/core"
          ]'
      export_cache:
        description: 'Whether this workflow run may write the shared Docker deps cache'
        type: boolean
        required: false
        default: true

jobs:
  unit-tests:
    name: Unit Tests ${{ matrix.target }}
    runs-on: ubuntu-24.04
    if: ${{ inputs.changed != '[]' }}
    env:
      DOCKER_BUILDKIT: 1
      BUILDKIT_PROGRESS: plain
      BUILDKIT_STEP_LOG_MAX_SIZE: 50000000
      # below env vars are just used by locksmith
      DB_USERNAME: locksmith_test
      DB_PASSWORD: password
      DB_NAME: locksmith_test
      DB_HOSTNAME: db
    strategy:
      matrix:
        target: ${{fromJson( inputs.changed )}}
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      # Only one matrix entry writes the shared GHA cache; siblings restore from GHA or Docker Hub fallback.
      - name: Build and export Docker deps layer
        if: ${{ inputs.export_cache && matrix.target == fromJson(inputs.changed)[0] }}
        uses: docker/build-push-action@v6
        with:
          context: .
          build-args: BUILDKIT_INLINE_CACHE=1
          target: deps
          tags: unlockprotocol/unlock-dev:latest
          cache-from: |
            type=gha,scope=docker-deps
            type=registry,ref=unlockprotocol/unlock-dev:latest
          cache-to: type=gha,scope=docker-deps,mode=max
          load: true
      # All other matrix entries restore the deps image without attempting another cache export.
      - name: Restore Docker deps layer
        if: ${{ !inputs.export_cache || matrix.target != fromJson(inputs.changed)[0] }}
        uses: docker/build-push-action@v6
        with:
          context: .
          build-args: BUILDKIT_INLINE_CACHE=1
          target: deps
          tags: unlockprotocol/unlock-dev:latest
          cache-from: |
            type=gha,scope=docker-deps
            type=registry,ref=unlockprotocol/unlock-dev:latest
          load: true
      - name: Running ${{ matrix.target }} tests
        run: ./scripts/tests.sh ${{ matrix.target }}
        shell: bash

