name: 'Production Branch'

on:
  push:
    branches:
      - production

jobs:
  deploy-all-subgraphs:
    if: ${{ github.repository_owner == 'unlock-protocol' }}
    uses: ./.github/workflows/_subgraph.yml
    secrets:
      OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}

  deploy-locksmith-web-production:
    if: ${{ github.repository_owner == 'unlock-protocol' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Load secrets from 1Password
        uses: 1Password/load-secrets-action@v2.0.0
        with:
          # Export loaded secrets as environment variables
          export-env: true
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          RAILWAY_TOKEN: op://secrets/railway/railway-token-production
          RAILWAY_SERVICE_ID: op://secrets/railway/locksmith-web-service-id
      - name: Deploy on Railway
        uses: ./.github/actions/railway
        with:
          service: web
          environment: production
          service-id: ${{ env.RAILWAY_SERVICE_ID }}
          railway-token: ${{ env.RAILWAY_TOKEN }}

  deploy-locksmith-worker-production:
    if: ${{ github.repository_owner == 'unlock-protocol' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Load secrets from 1Password
        uses: 1Password/load-secrets-action@v2.0.0
        with:
          # Export loaded secrets as environment variables
          export-env: true
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          RAILWAY_TOKEN: op://secrets/railway/railway-token-production
          RAILWAY_SERVICE_ID: op://secrets/railway/locksmith-worker-service-id
      - name: Deploy on Railway
        uses: ./.github/actions/railway
        with:
          service: worker
          environment: production
          service-id: ${{ env.RAILWAY_SERVICE_ID }}
          railway-token: ${{ env.RAILWAY_TOKEN }}

  # Vercel Deployments
  deploy-paywall-app-production:
    if: ${{ github.repository_owner == 'unlock-protocol' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Load secrets from 1Password
        uses: 1Password/load-secrets-action@v2.0.0
        with:
          export-env: true
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          PAYWALL_APP_VERCEL_PROD_VERCEL_PROJECT_ID: op://secrets/vercel/project-id-paywall-app-prod
          PAYWALL_APP_VERCEL_PROD_VERCEL_ORG_ID: op://secrets/vercel/org-id
          PAYWALL_APP_VERCEL_PROD_VERCEL_TOKEN: op://secrets/vercel/deployment-token
      - uses: ./.github/actions/vercel
        with:
          service: paywall-app
          target-env: prod

  deploy-wedlocks:
    if: ${{ github.repository_owner == 'unlock-protocol' }}
    uses: ./.github/workflows/_cloudflare-worker.yml
    with:
      workspace: '@unlock-protocol/wedlocks'
      wrangler-environment: production
      post-deploy-command: |
        if [ -z "$SMTP_PASSWORD" ]; then
          echo '::error::SMTP_PASSWORD is required to update wedlocks SMTP credentials.'
          exit 1
        fi

        printf '%s' "$SMTP_PASSWORD" | yarn workspace "$WORKSPACE" exec wrangler secret put SMTP_PASSWORD --env "$WRANGLER_ENVIRONMENT"
      smoke-test-command: |
        body=$(curl --retry 5 --retry-all-errors --retry-delay 3 -fsS -H 'Accept: application/json' 'https://wedlocks.unlock-protocol.com/preview/debug?foo=bar')
        printf '%s' "$body" | grep -q '"subject":"Debug Email"'
    secrets:
      SMTP_PASSWORD: ${{ secrets.WEDLOCKS_NETLIFY_PROD_SMTP_PASSWORD }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

  deploy-rpc-provider:
    if: ${{ github.repository_owner == 'unlock-protocol' }}
    uses: ./.github/workflows/_cloudflare-worker.yml
    with:
      workspace: '@unlock-protocol/provider'
      sync-secrets-command: yarn workspace @unlock-protocol/provider set-env-vars
      smoke-test-command: |
        body=$(curl --retry 5 --retry-all-errors --retry-delay 3 -fsS \
          -H 'Content-Type: application/json' \
          --data '{"jsonrpc":"2.0","id":1,"method":"eth_chainId","params":[]}' \
          'https://rpc.unlock-protocol.com/1')
        printf '%s' "$body" | grep -q '"result":"0x1"'
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}

  deploy-graph-service:
    if: ${{ github.repository_owner == 'unlock-protocol' }}
    uses: ./.github/workflows/_cloudflare-worker.yml
    with:
      workspace: graph-service
      sync-secrets-command: yarn workspace graph-service set-graph-urls
      smoke-test-command: |
        headers=$(mktemp)
        curl --retry 5 --retry-all-errors --retry-delay 3 -fsS -D "$headers" -o /dev/null 'https://subgraph.unlock-protocol.com/1'
        grep -iq '^location: https://thegraph.com/explorer/subgraphs/' "$headers"
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}

  deploy-unlock-app-vercel:
    if: ${{ github.repository_owner == 'unlock-protocol'  }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Load secrets from 1Password
        uses: 1Password/load-secrets-action@v2.0.0
        with:
          export-env: true
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          UNLOCK_APP_VERCEL_PROD_VERCEL_PROJECT_ID: op://secrets/vercel/project-id-unlock-app-prod
          UNLOCK_APP_VERCEL_PROD_VERCEL_ORG_ID: op://secrets/vercel/org-id
          UNLOCK_APP_VERCEL_PROD_VERCEL_TOKEN: op://secrets/vercel/deployment-token
          UNLOCK_APP_VERCEL_PROD_NEXT_PUBLIC_STRIPE_KEY: op://secrets/stripe/publishable-key-prod
          UNLOCK_APP_VERCEL_PROD_NEXT_PUBLIC_ETHPASS_KEY: op://secrets/ethpass/username
          UNLOCK_APP_VERCEL_PROD_NEXT_PUBLIC_UNLOCK_ENV: prod
          UNLOCK_APP_VERCEL_PROD_GOOGLE_CLIENT_SECRET: op://secrets/google/prod-secret
          UNLOCK_APP_VERCEL_PROD_NEXTAUTH_SECRET: op://secrets/nextauth/prod-secret
      - uses: ./.github/actions/vercel
        with:
          service: unlock-app
          target-env: prod
        env:
          UNLOCK_APP_VERCEL_PROD_NEXTAUTH_URL: 'https://app.unlock-protocol.com'
