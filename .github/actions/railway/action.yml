name: Deploy on Railway

inputs:
  service:
    description: 'The service/app to build'
    type: string
    required: true
  service-id:
    description: 'The Railway service ID to deploy to (or 1Password reference)'
    type: string
    required: true
  environment:
    description: 'The Railway environment to deploy to'
    type: string
    required: true
  railway-token:
    description: 'Railway auth token'
    type: string
    required: true
runs:
  using: 'composite'
  steps:
    - name: Install Railway CLI
      shell: bash
      # Pinned: v4.45.0 is the minimum that accepts the current RAILWAY_TOKEN format.
      # Dockerfile path is set via railway.toml — verify new versions still support
      # subdirectory dockerfilePath before upgrading.
      run: npm i -g @railway/cli@4.45.0

    - name: Deploy to Railway
      shell: bash
      run: railway up --ci --service=${{ inputs.service-id }} --environment=${{ inputs.environment }}
