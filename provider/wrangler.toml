name = "rpc-provider"
main = "src/index.ts"
account_id = "30fa248ff7b03cfcac765dae9509bba0"
# 2024-09-23 is the minimum date required for global_fetch_strictly_public (added ~late 2024).
# The Cloudflare compatibility changelog between the previous date (2022-08-17) and this one
# was reviewed before this change landed: the only flags that affect this worker are fetch-related
# (no URL parser changes, no Headers behaviour changes relevant to our POST/JSON usage).
compatibility_date = "2024-09-23"
# global_fetch_strictly_public prevents Cloudflare from routing fetch() through its
# internal CDN paths, which cause SSL handshake failures (HTTP 525) with Alchemy endpoints
# for certain chains. Keep this flag — removing it re-introduces those failures.
compatibility_flags = ["global_fetch_strictly_public"]
tail_consumers = [{service = "rpc-provider-tail"}]

# Optional environment variables
[vars]
# Cache duration in seconds for ENS/Basename resolution (default: 1 day)
CACHE_DURATION_SECONDS = "86400" # TODO: extend to 1 month when we have more confidence in the cache

# Rate limiting using Cloudflare's Rate Limiting API
# The rate limiting API is in open beta
[[unsafe.bindings]]
name = "STANDARD_RATE_LIMITER"
type = "ratelimit"
namespace_id = "1001"
# 10 requests per 10 seconds (similar to previous per-second limit)
simple = { limit = 10, period = 10 }

[[unsafe.bindings]]
name = "HOURLY_RATE_LIMITER"
type = "ratelimit"
namespace_id = "1002"
# 1000 requests per 60 minutes (similar to previous hourly limit)
simple = { limit = 1000, period = 60 }


# Development configuration
[dev]
port = 8787

# KV namespace for allowed contracts
[[kv_namespaces]]
binding = "ALLOWED_CONTRACTS"
id = "9073bea6f14048f09e64e75bcb3fba81"
preview_id = "dev-allowed-contracts"


# KV namespace for request caching
[[kv_namespaces]]
binding = "REQUEST_CACHE"
id = "0d52c25fc4cf4e8eb5cbd944a8bfb5d9"
preview_id = "dev-request-cache"


[observability]
enabled = true
head_sampling_rate = 1 # optional. default = 1.
